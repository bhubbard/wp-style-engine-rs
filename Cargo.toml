[package]
name = "wp-style-engine-rs"
version = "0.1.1"
edition = "2024"
description = "Rust port of @wordpress/style-engine — compiles Gutenberg block style objects into inline CSS or scoped stylesheets"
license = "GPL-2.0"
repository = "https://github.com/wp-rust/wp-style-engine-rs"
homepage = "https://github.com/wp-rust/wp-style-engine-rs"
documentation = "https://docs.rs/wp-style-engine-rs"
keywords = ["wordpress", "gutenberg", "css", "styles", "theme"]
categories = ["text-processing", "encoding"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
